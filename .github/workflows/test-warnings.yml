name: Warning decay tests

on:
  pull_request:
    paths:
      - "warning_manager.py"
      - "test_warning_manager.py"
      - ".github/workflows/test-warnings.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test warning store (no Discord token needed)
        run: python -m unittest -v test_warning_manager.py
      - name: Check syntax
        run: python -m py_compile warning_manager.py contribution_bot.py
