name: 윤슬봇 일일 완료 작성

on:
  schedule:
    # GitHub Actions는 UTC 기준
    # 15:20 UTC = 한국시간 00:20
    - cron: "20 15 * * *"
  workflow_dispatch:

concurrency:
  group: yunsul-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 윤슬봇 실행
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python post_daily.py
